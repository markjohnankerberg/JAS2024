{% require_css %}
  <style>
    .share-{{name}} *,
    .share-{{name}} *::before,
    .share-{{name}} *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    .share-{{name}} {
      position: relative;
      padding: 9px 0;
    }
    
    .share-{{name}} .list-title {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      text-transform: uppercase;
      color: var(--clr-dark-beige);
      transition: var(--transition);
      cursor: pointer;
    }
    
    .share-{{name}} .list-title:hover {
      color: var(--clr-grey);
    }
    
    .share-{{name}} .list-title svg path,
    .share-{{name}} .share-list li svg path {
      fill: var(--clr-dark-beige);
      transition: var(--transition);
    }
    
    .share-{{name}} .list-title:hover svg path,
    .share-{{name}} .share-list li:hover svg path {
      fill: var(--clr-grey);
    }
    
    .share-{{name}} .share-list {
      list-style: none;
      display: none;
      position: absolute;
      right: 0;
      top: 37px;
      width: max-content;
      background: #fff;
      padding: 20px;
      border: 1px solid #D5D5D5;
      border-radius: 5px;
      z-index: 10;
      flex-direction: column;
      gap: 10px;
    }
    
    .share-{{name}}:hover .share-list {
      display: flex;
    }
    
    .share-{{name}} .share-list li.copy-url,
    .share-{{name}} .share-list li a {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      line-height: 26px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--clr-dark-beige);
      transition: var(--transition);
    }
    
    .share-{{name}} .share-list li.copy-url:hover,
    .share-{{name}} .share-list li a:hover {
      color: var(--clr-grey);
    }
    
    .share-{{name}} .share-list li.copy-url {
      position: relative;
    }
    
    .share-{{name}} .share-list li.copy-url .btn-tooltip {
      font-size: 13px;
      padding: 8px;
      border-radius: 8px;
      background: var(--clr-light);
      color: var(--clr-dark-beige);
      border: 1px solid #D5D5D5;
      user-select: none;
      pointer-events: none;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      transition: 0.3s;
    }
    
    .share-{{name}} .share-list li.copy-url .btn-tooltip.active {
      opacity: 1;
      transform: translateY(-130%);
    }
  </style>
{% end_require_css %}
